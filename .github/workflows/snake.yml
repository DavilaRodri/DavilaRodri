# Dibuja la serpiente que se come el gráfico de contribuciones (y crece) y la deja en la rama "output"
name: Serpiente de contribuciones

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  serpiente:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Serpiente propia (scripts/serpiente.mjs): crece con cada día con contribuciones que se come
      - name: Descargar el gráfico de contribuciones
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql -F login="${{ github.repository_owner }}" -f query='
            query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  contributionCalendar {
                    weeks { contributionDays { contributionCount contributionLevel weekday } }
                  }
                }
              }
            }' > datos.json
      - name: Dibujar la serpiente
        run: node scripts/serpiente.mjs datos.json dist/snake.svg
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
